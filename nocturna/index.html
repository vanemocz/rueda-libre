<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Rueda Nocturna</title>
</head>

<body>
    <main>
        <section class="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-8 text-center">
            <p class="text-sm font-semibold uppercase tracking-widest text-emerald-400 mb-4">Nuevo · Jueves a sábado</p>

            <h1 class="text-5xl font-bold tracking-tight mb-4">Rueda Nocturna</h1>

            <p class="text-lg text-slate-300 max-w-xl mb-8">Descubre Medellín en bici cuando se encienden las luces</p>

            <div class="flex gap-8 mb-8">
                <p class="text-xl font-semibold text-emerald-400">3 rutas</p>
                <p class="text-xl font-semibold text-emerald-400">Desde $55.000</p>
            </div>

            <a href="#" class="bg-emerald-500 text-slate-950 px-8 py-3 rounded-full font-bold text-lg">Inscríbete</a>
        </section>


        <section class="flex flex-wrap justify-center gap-6 p-8">

            <!-- Botón principal -->
            <button
                class="bg-emerald-500 text-slate-950 px-6 py-3 rounded-lg font-semibold hover:bg-emerald-400 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300">
                Principal
            </button>

            <!-- Botón secundario -->
            <button
                class="bg-slate-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-slate-600 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-slate-300">
                Secundario
            </button>

            <!-- Botón de contorno -->
            <button
                class="border-2 border-emerald-400 text-emerald-400 px-6 py-3 rounded-lg font-semibold hover:bg-emerald-400 hover:text-slate-950 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300">
                Contorno
            </button>

        </section>


    </main>
</body>

</html>
